name: verify

# Website verification gate — the gold check is `npm run build` (Next.js
# production build). Runs on every PR and on push to main as a
# belt-and-suspenders check. No deploy step here — Railway auto-deploys
# from main separately, gated on this workflow being green (see
# ../ground-goat-backend/docs/VERIFY_PROTOCOL.md in the backend repo).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Production build (next build)
        run: npm run build
