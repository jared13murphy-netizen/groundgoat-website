# Build the website Docker image in GitHub Actions and publish it to GHCR.
# Nothing here touches the production host: this exists so images are never
# built on gg-app-1 (owner rule 2026-09-02). Run it by hand for any ref:
#   gh workflow run build-image.yml -r <branch> -f tag=<tag> -f api_url=... -f deploy_sandbox=true
# The optional deploy_sandbox step pulls the image into the SANDBOX stack only.
name: Build image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. sandbox, main)"
        required: true
        default: sandbox
      api_url:
        description: "NEXT_PUBLIC_API_URL baked into the bundle"
        required: true
        default: https://sandbox-api.groundgoat.com
      tiles_url:
        required: true
        default: https://tiles.groundgoat.com
      scraper_url:
        required: false
        default: ""
      is_sandbox:
        description: "NEXT_PUBLIC_IS_SANDBOX"
        required: false
        default: "true"
      live_url:
        required: false
        default: https://www.groundgoat.com
      host:
        description: "Sandbox host to pull into (public IP or DNS name)"
        required: false
        default: "100.63.171.136"
      deploy_sandbox:
        description: "Pull the image into /opt/gg/sandbox on gg-app-1 and restart sandbox-web"
        required: false
        default: "false"
permissions:
  contents: read
  packages: write
concurrency:
  group: build-image-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/groundgoat-website:${{ inputs.tag }}
            ghcr.io/${{ github.repository_owner }}/groundgoat-website:${{ inputs.tag }}-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ inputs.api_url }}
            NEXT_PUBLIC_TILES_URL=${{ inputs.tiles_url }}
            NEXT_PUBLIC_SCRAPER_URL=${{ inputs.scraper_url }}
            NEXT_PUBLIC_IS_SANDBOX=${{ inputs.is_sandbox }}
            NEXT_PUBLIC_LIVE_URL=${{ inputs.live_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to sandbox (pull only, no build on the host)
        if: ${{ inputs.deploy_sandbox == 'true' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GG_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H '${{ inputs.host }}' >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o ServerAliveInterval=30 ubuntu@'${{ inputs.host }}' "echo '${{ secrets.GITHUB_TOKEN }}' | sudo docker login ghcr.io -u '${{ github.actor }}' --password-stdin && cd /opt/gg/sandbox && sudo docker compose pull sandbox-web && sudo docker compose up -d --no-build sandbox-web && sudo docker logout ghcr.io"
