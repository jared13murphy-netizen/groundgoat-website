<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ground Goat - 3D Terrain Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; }
  #canvas-container { width: 100%; height: 100%; position: relative; }
  canvas { display: block; }

  /* Loading overlay */
  #loading-overlay {
    position: fixed; inset: 0; background: #1a1a1a; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 1000; transition: opacity 0.5s;
  }
  #loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.15);
    border-top-color: #E91E8C; border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-text { margin-top: 16px; font-size: 14px; color: #aaa; }
  #progress-bar-container {
    width: 200px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 12px; overflow: hidden;
  }
  #progress-bar { height: 100%; width: 0%; background: #E91E8C; border-radius: 2px; transition: width 0.3s; }

  /* Error overlay */
  #error-overlay {
    position: fixed; inset: 0; background: #1a1a1a; display: none; flex-direction: column;
    align-items: center; justify-content: center; z-index: 1001;
  }
  #error-overlay .error-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
  #error-overlay .error-msg { font-size: 16px; color: #aaa; text-align: center; max-width: 320px; }

  /* Sidebar */
  #sidebar {
    position: fixed; top: 0; left: 0; width: 220px; height: 100%; background: rgba(20,20,20,0.92);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 20px 16px;
    overflow-y: auto; z-index: 100; border-right: 1px solid rgba(255,255,255,0.08);
    transition: transform 0.3s ease;
  }
  #sidebar.collapsed { transform: translateX(-220px); }
  #sidebar-toggle {
    position: fixed; top: 12px; left: 12px; z-index: 101; width: 36px; height: 36px;
    background: rgba(20,20,20,0.85); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
    color: #fff; font-size: 18px; cursor: pointer; display: none; align-items: center; justify-content: center;
  }
  .sidebar-section { margin-bottom: 20px; }
  .sidebar-title { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; color: #888; margin-bottom: 8px; text-transform: uppercase; }
  .tract-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tract-sub { font-size: 11px; color: #888; }
  .radio-group label {
    display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; cursor: pointer; color: #ccc;
  }
  .radio-group label:hover { color: #fff; }
  .radio-group input[type="radio"] { accent-color: #E91E8C; width: 14px; height: 14px; }
  .slider-row { display: flex; flex-direction: column; gap: 4px; }
  .slider-label { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; }
  .slider-row input[type="range"] {
    width: 100%; height: 4px; -webkit-appearance: none; background: rgba(255,255,255,0.15); border-radius: 2px; outline: none;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #E91E8C; cursor: pointer;
  }
  .stat-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
  .stat-label { color: #888; }
  .stat-value { color: #ddd; font-weight: 500; }

  /* Legend (bottom-right) */
  #legend {
    position: fixed; bottom: 16px; right: 16px; background: rgba(20,20,20,0.9);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 10px;
    padding: 12px 14px; z-index: 100; min-width: 140px; border: 1px solid rgba(255,255,255,0.08);
  }
  #legend-title { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #888; margin-bottom: 8px; text-transform: uppercase; }
  #legend-gradient { width: 100%; height: 14px; border-radius: 3px; margin-bottom: 4px; }
  #legend-labels { display: flex; justify-content: space-between; font-size: 10px; color: #888; }
  #histogram-canvas { width: 100%; height: 40px; margin-top: 8px; border-radius: 3px; }

  /* Tooltip */
  #tooltip {
    position: fixed; background: rgba(0,0,0,0.88); border-radius: 8px; padding: 8px 12px;
    pointer-events: none; z-index: 200; display: none; font-size: 12px; white-space: nowrap;
    border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(4px);
  }
  .tooltip-label { font-size: 9px; font-weight: 700; letter-spacing: 0.8px; color: #888; text-transform: uppercase; }
  .tooltip-value { font-size: 14px; font-weight: 600; color: #fff; }

  /* Responsive: small screens */
  @media (max-width: 600px) {
    #sidebar { width: 200px; }
    #sidebar.collapsed { transform: translateX(-200px); }
    #sidebar-toggle { display: flex; }
    #legend { bottom: 10px; right: 10px; }
  }
</style>
</head>
<body>
<div id="canvas-container"></div>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div id="loading-text">Loading terrain data...</div>
  <div id="progress-bar-container"><div id="progress-bar"></div></div>
</div>

<div id="error-overlay">
  <div class="error-icon">&#9650;</div>
  <div class="error-msg" id="error-msg">No elevation data available</div>
</div>

<button id="sidebar-toggle" onclick="toggleSidebar()">&#9776;</button>
<div id="sidebar">
  <div class="sidebar-section">
    <div class="tract-name" id="tract-name">Loading...</div>
    <div class="tract-sub" id="tract-sub"></div>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-title">Drape Layer</div>
    <div class="radio-group" id="layer-group">
      <label><input type="radio" name="layer" value="elevation" checked> Elevation</label>
      <label><input type="radio" name="layer" value="nccpi"> NCCPI</label>
      <label><input type="radio" name="layer" value="soiltypes"> Soil Types</label>

    </div>

    <div class="stat-row"><span class="stat-label">Min</span><span class="stat-value" id="stat-min">--</span></div>
    <div class="stat-row"><span class="stat-label">Max</span><span class="stat-value" id="stat-max">--</span></div>
    <div class="stat-row"><span class="stat-label">Mean</span><span class="stat-value" id="stat-mean">--</span></div>
    <div class="stat-row"><span class="stat-label">Relief</span><span class="stat-value" id="stat-relief">--</span></div>
  </div>
</div>

<div id="legend">
  <div id="legend-title">Elevation</div>
  <canvas id="legend-gradient" width="140" height="14"></canvas>
  <div id="legend-labels"><span id="legend-min"></span><span id="legend-max"></span></div>
  <canvas id="histogram-canvas" width="140" height="40"></canvas>
</div>

<div id="tooltip">
  <div class="tooltip-label">Elevation</div>
  <div class="tooltip-value" id="tooltip-elev">--</div>
  <div class="tooltip-label" id="tooltip-layer-label" style="margin-top:4px"></div>
  <div class="tooltip-value" id="tooltip-layer-value"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---- URL Params ----
const params = new URLSearchParams(window.location.search);
const tractId = params.get('tractId');
const token = params.get('token');
const apiUrl = params.get('apiUrl') || '';

if (!tractId) {
  showError('Missing tractId parameter in URL');
}

// ---- State ----
let scene, camera, renderer, controls, terrainMesh, boundaryLine;
let demData = null, tractData = null, soilData = null;
let elevationGrid = [], rows = 0, cols = 0;
let minElev = Infinity, maxElev = -Infinity, meanElev = 0;
let slopeGrid = [];
let currentLayer = 'elevation';
let exaggeration = 1.0;
let satelliteTexture = null;
let satelliteLoaded = false;
let nccpiVertexValues = [];
let soilOverlayGroup = null; // Group containing soil polygon overlay meshes

// ---- API Helpers ----
function apiHeaders() {
  const h = { 'Content-Type': 'application/json' };
  if (token) h['Authorization'] = `Bearer ${token}`;
  return h;
}

async function apiFetch(path) {
  const url = `${apiUrl}${path}`;
  const resp = await fetch(url, { headers: apiHeaders() });
  if (!resp.ok) throw new Error(`API ${resp.status}: ${resp.statusText}`);
  return resp.json();
}

// ---- Loading UI ----
function setProgress(pct) {
  document.getElementById('progress-bar').style.width = pct + '%';
}
function setLoadingText(text) {
  document.getElementById('loading-text').textContent = text;
}
function hideLoading() {
  document.getElementById('loading-overlay').classList.add('hidden');
}
function showError(msg) {
  document.getElementById('loading-overlay').style.display = 'none';
  const overlay = document.getElementById('error-overlay');
  overlay.style.display = 'flex';
  document.getElementById('error-msg').textContent = msg;
}

// ---- Sidebar toggle ----
window.toggleSidebar = function() {
  document.getElementById('sidebar').classList.toggle('collapsed');
};

// Check small screen on load
if (window.innerWidth <= 600) {
  document.getElementById('sidebar').classList.add('collapsed');
  document.getElementById('sidebar-toggle').style.display = 'flex';
}

// ---- Color utilities ----
function elevationColor(t) {
  // Rainbow: red -> orange -> yellow -> green -> cyan -> blue -> purple
  t = Math.max(0, Math.min(1, t));
  const stops = [
    [0.0,  1.0, 0.0, 0.0],   // red
    [0.167, 1.0, 0.533, 0.0], // orange
    [0.333, 1.0, 1.0, 0.0],   // yellow
    [0.5,  0.0, 1.0, 0.0],   // green
    [0.667, 0.0, 1.0, 1.0],   // cyan
    [0.833, 0.0, 0.0, 1.0],   // blue
    [1.0,  0.533, 0.0, 1.0],  // purple
  ];
  for (let i = 0; i < stops.length - 1; i++) {
    if (t >= stops[i][0] && t <= stops[i+1][0]) {
      const f = (t - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      return new THREE.Color(
        stops[i][1] + f * (stops[i+1][1] - stops[i][1]),
        stops[i][2] + f * (stops[i+1][2] - stops[i][2]),
        stops[i][3] + f * (stops[i+1][3] - stops[i][3])
      );
    }
  }
  return new THREE.Color(0.533, 0, 1);
}

function nccpiColor(val) {
  if (val == null) return new THREE.Color(0.3, 0.3, 0.3);
  if (val >= 80) return new THREE.Color(0, 0.392, 0);       // dark green
  if (val >= 60) return new THREE.Color(0.565, 0.933, 0.565); // light green
  if (val >= 40) return new THREE.Color(1, 1, 0);            // yellow
  if (val >= 20) return new THREE.Color(1, 0.647, 0);        // orange
  return new THREE.Color(1, 0, 0);                           // red
}

function slopeColor(pct) {
  if (pct < 2) return new THREE.Color(0.2, 0.8, 0.2);   // green
  if (pct < 5) return new THREE.Color(1, 1, 0);          // yellow
  if (pct < 10) return new THREE.Color(1, 0.6, 0);       // orange
  return new THREE.Color(1, 0, 0);                        // red
}

// ---- Point-in-polygon ----
function pointInPolygon(x, y, polygon) {
  let inside = false;
  for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
    const xi = polygon[i][0], yi = polygon[i][1];
    const xj = polygon[j][0], yj = polygon[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) {
      inside = !inside;
    }
  }
  return inside;
}

// ---- Compute slope grid ----
function computeSlopeGrid(grid, rows, cols, cellWidth, cellHeight) {
  const slopes = [];
  for (let r = 0; r < rows; r++) {
    slopes[r] = [];
    for (let c = 0; c < cols; c++) {
      let dzdx = 0, dzdy = 0;
      const z = grid[r][c];
      if (z == null) { slopes[r][c] = 0; continue; }
      // Central difference where possible
      const zLeft = c > 0 && grid[r][c-1] != null ? grid[r][c-1] : z;
      const zRight = c < cols-1 && grid[r][c+1] != null ? grid[r][c+1] : z;
      const zDown = r > 0 && grid[r-1][c] != null ? grid[r-1][c] : z;
      const zUp = r < rows-1 && grid[r+1][c] != null ? grid[r+1][c] : z;
      dzdx = (zRight - zLeft) / (2 * cellWidth);
      dzdy = (zUp - zDown) / (2 * cellHeight);
      const slopePct = Math.sqrt(dzdx * dzdx + dzdy * dzdy) * 100;
      slopes[r][c] = slopePct;
    }
  }
  return slopes;
}

// ---- Assign NCCPI values to vertices ----
// Old uniform NCCPI function removed — replaced by polygon-aware version below

// Assign NCCPI value to each vertex based on which soil polygon it falls within
function assignNccpiToVertices(rows, cols, bbox, polyCoords, soilUnits) {
  const grid = [];
  // Build a weighted average NCCPI as fallback
  let avgNccpi = null;
  let total = 0, count = 0;
  for (const u of soilUnits) {
    if (u.nccpi != null) { total += u.nccpi; count++; }
  }
  if (count > 0) avgNccpi = total / count;

  // Build array of soil polygons with NCCPI
  const soilPolys = [];
  for (const unit of soilUnits) {
    if (unit.polygons && unit.nccpi != null) {
      for (const ring of unit.polygons) {
        soilPolys.push({ ring, nccpi: unit.nccpi });
      }
    }
  }

  for (let r = 0; r < rows; r++) {
    const row = [];
    for (let c = 0; c < cols; c++) {
      const lng = bbox.min_lng + (c / (cols - 1)) * (bbox.max_lng - bbox.min_lng);
      const lat = bbox.min_lat + (r / (rows - 1)) * (bbox.max_lat - bbox.min_lat);

      // Check which soil polygon this point falls within
      let nccpi = null;
      for (const sp of soilPolys) {
        if (pointInPolygon(lng, lat, sp.ring)) {
          nccpi = sp.nccpi;
          break;
        }
      }
      // Fallback to average if no polygon match
      if (nccpi == null) nccpi = avgNccpi;
      row.push(nccpi);
    }
    grid.push(row);
  }
  return grid;
}

// ---- Create soil polygon overlays ----
const SOIL_TYPE_COLORS = ['#e41a1c','#377eb8','#4daf4a','#984ea3','#ff7f00','#a65628','#f781bf','#999999','#66c2a5','#fc8d62','#8da0cb','#e78ac3'];

function createSoilOverlays(soilUnits, bbox, sceneW, sceneH) {
  const group = new THREE.Group();
  if (!soilUnits || !bbox) return group;

  const lngRange = bbox.max_lng - bbox.min_lng || 1;
  const latRange = bbox.max_lat - bbox.min_lat || 1;
  const ud = terrainMesh ? terrainMesh.userData : {};
  const elevRange = ud.elevRange || (maxElev - minElev) || 1;

  soilUnits.forEach((unit, idx) => {
    if (!unit.polygons) return;

    unit.polygons.forEach(ring => {
      if (!ring || ring.length < 3) return;

      const shape = new THREE.Shape();
      ring.forEach((coord, i) => {
        // coord is [lng, lat]
        const x = ((coord[0] - bbox.min_lng) / lngRange - 0.5) * sceneW;
        const y = ((coord[1] - bbox.min_lat) / latRange - 0.5) * sceneH;
        if (i === 0) shape.moveTo(x, y);
        else shape.lineTo(x, y);
      });

      const geom = new THREE.ShapeGeometry(shape);

      // Drape on terrain: set Z for each vertex from elevation grid
      const positions = geom.attributes.position;
      for (let i = 0; i < positions.count; i++) {
        const px = positions.getX(i);
        const py = positions.getY(i);
        // Convert scene coords back to grid coords
        const gc = (px / sceneW + 0.5) * (cols - 1);
        const gr = (py / sceneH + 0.5) * (rows - 1);
        const r = Math.min(Math.max(Math.round(gr), 0), rows - 1);
        const c = Math.min(Math.max(Math.round(gc), 0), cols - 1);
        const elev = (elevationGrid[r] && elevationGrid[r][c] != null) ? elevationGrid[r][c] : minElev;
        const elevNorm = (elev - minElev) / elevRange;
        const zVal = elevNorm * (sceneH * 0.3) * exaggeration + 0.05;
        positions.setZ(i, zVal);
      }
      positions.needsUpdate = true;

      // NCCPI-colored mesh
      const nccpiMat = new THREE.MeshBasicMaterial({
        color: nccpiColor(unit.nccpi),
        transparent: true,
        opacity: 0.75,
        side: THREE.DoubleSide,
        depthWrite: false,
      });
      const nccpiMesh = new THREE.Mesh(geom.clone(), nccpiMat);
      nccpiMesh.userData = { layerType: 'nccpi', name: unit.name || unit.musym || ('Soil ' + idx), nccpi: unit.nccpi };
      nccpiMesh.visible = false;
      // After rotation of parent group by -PI/2 around X, the shape (in XY plane) needs to match.
      // The parent group will be rotated like the terrain mesh.
      group.add(nccpiMesh);

      // Soil-type-colored mesh
      const typeMat = new THREE.MeshBasicMaterial({
        color: SOIL_TYPE_COLORS[idx % SOIL_TYPE_COLORS.length],
        transparent: true,
        opacity: 0.7,
        side: THREE.DoubleSide,
        depthWrite: false,
      });
      const typeMesh = new THREE.Mesh(geom.clone(), typeMat);
      typeMesh.userData = { layerType: 'soiltype', name: unit.name || unit.musym || ('Soil ' + idx), nccpi: unit.nccpi };
      typeMesh.visible = false;
      group.add(typeMesh);
    });
  });

  // Rotate the group to match terrain mesh orientation
  group.rotation.x = -Math.PI / 2;
  return group;
}

function updateSoilOverlayExaggeration() {
  if (!soilOverlayGroup || !terrainMesh) return;
  const ud = terrainMesh.userData;
  const elevRange = ud.elevRange || 1;

  soilOverlayGroup.children.forEach(mesh => {
    const positions = mesh.geometry.attributes.position;
    for (let i = 0; i < positions.count; i++) {
      const px = positions.getX(i);
      const py = positions.getY(i);
      const gc = (px / ud.sceneW + 0.5) * (cols - 1);
      const gr = (py / ud.sceneH + 0.5) * (rows - 1);
      const r = Math.min(Math.max(Math.round(gr), 0), rows - 1);
      const c = Math.min(Math.max(Math.round(gc), 0), cols - 1);
      const elev = (elevationGrid[r] && elevationGrid[r][c] != null) ? elevationGrid[r][c] : minElev;
      const elevNorm = (elev - minElev) / elevRange;
      const zVal = elevNorm * (ud.sceneH * 0.3) * exaggeration + 0.05;
      positions.setZ(i, zVal);
    }
    positions.needsUpdate = true;
  });
}

// ---- Build 3D Scene ----
function initScene() {
  const container = document.getElementById('canvas-container');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a1a);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 1;
  controls.maxDistance = 100;
  controls.maxPolarAngle = Math.PI / 2.05;

  // Lights
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);
  const ambLight = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambLight);

  window.addEventListener('resize', onResize);
  onResize();
}

function onResize() {
  const container = document.getElementById('canvas-container');
  const w = container.clientWidth, h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

// ---- Build terrain mesh ----
function buildTerrain() {
  const bbox = demData.bbox;
  rows = demData.rows;
  cols = demData.cols;
  elevationGrid = demData.grid;

  // Compute geographic dimensions in approximate meters then normalize
  const latMid = (bbox.min_lat + bbox.max_lat) / 2;
  const lngSpanDeg = bbox.max_lng - bbox.min_lng;
  const latSpanDeg = bbox.max_lat - bbox.min_lat;
  // Approx meters per degree
  const mPerDegLat = 111320;
  const mPerDegLng = 111320 * Math.cos(latMid * Math.PI / 180);
  const widthM = lngSpanDeg * mPerDegLng;
  const heightM = latSpanDeg * mPerDegLat;

  // Normalize to a nice scene size (max dimension = 10 units)
  const maxDim = Math.max(widthM, heightM);
  const scale = 10 / maxDim;
  const sceneW = widthM * scale;
  const sceneH = heightM * scale;

  // Cell dimensions in feet for slope calculation
  const cellWidthFt = (widthM / (cols - 1)) * 3.28084;
  const cellHeightFt = (heightM / (rows - 1)) * 3.28084;

  // Flatten elevation grid and compute stats
  let elevMin = Infinity, elevMax = -Infinity, elevSum = 0, elevCount = 0;
  const flatElev = [];
  const polyCoords = tractData ? tractData.polygon_coordinates : null;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const v = elevationGrid[r][c];
      if (v != null) {
        if (v < elevMin) elevMin = v;
        if (v > elevMax) elevMax = v;
        elevSum += v;
        elevCount++;
      }
      flatElev.push(v);
    }
  }
  minElev = elevMin;
  maxElev = elevMax;
  meanElev = elevCount > 0 ? elevSum / elevCount : 0;
  const elevRange = elevMax - elevMin || 1;

  // Slope grid
  slopeGrid = computeSlopeGrid(elevationGrid, rows, cols, cellWidthFt, cellHeightFt);

  // NCCPI values per vertex
  if (soilData && soilData.soil_map_units) {
    nccpiVertexValues = assignNccpiToVertices(rows, cols, bbox, polyCoords, soilData.soil_map_units);
  }

  // Create geometry
  const geometry = new THREE.PlaneGeometry(sceneW, sceneH, cols - 1, rows - 1);
  const positions = geometry.attributes.position;
  const colors = new Float32Array(positions.count * 3);

  // Mask for vertices outside polygon
  const insideMask = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const lng = bbox.min_lng + (c / (cols - 1)) * (bbox.max_lng - bbox.min_lng);
      const lat = bbox.min_lat + (r / (rows - 1)) * (bbox.max_lat - bbox.min_lat);
      const inside = !polyCoords || pointInPolygon(lng, lat, polyCoords);
      insideMask.push(inside);
    }
  }

  // Displace vertices by elevation
  // PlaneGeometry vertices go from top-left to bottom-right row by row
  // But our grid is row 0 = south. PlaneGeometry row 0 = top (+Y).
  // So we need to flip: PlaneGeometry row i corresponds to our grid row (rows-1-i).
  for (let i = 0; i < positions.count; i++) {
    const planeRow = Math.floor(i / cols);
    const planeCol = i % cols;
    const gridRow = rows - 1 - planeRow; // flip Y
    const elev = elevationGrid[gridRow][planeCol];
    const inside = insideMask[gridRow * cols + planeCol];

    if (elev != null) {
      // Convert elevation to scene units with exaggeration
      const elevNorm = (elev - elevMin) / elevRange;
      const zVal = elevNorm * (sceneH * 0.3) * exaggeration;
      positions.setZ(i, zVal);
    } else {
      // Set to mean elevation so there's no vertical wall
      const meanNorm = 0.5;
      positions.setZ(i, meanNorm * (sceneH * 0.3) * exaggeration);
    }
  }

  positions.needsUpdate = true;
  geometry.computeVertexNormals();

  // Apply elevation colors on initial load
  applyVertexColors(geometry, 'elevation');

  const material = new THREE.MeshPhongMaterial({
    vertexColors: true,
    side: THREE.DoubleSide,
    flatShading: false,
    shininess: 15,
  });

  terrainMesh = new THREE.Mesh(geometry, material);
  // Rotate so plane faces up (PlaneGeometry is XY, we want XZ)
  terrainMesh.rotation.x = -Math.PI / 2;
  scene.add(terrainMesh);

  // Build boundary line
  buildBoundaryLine(bbox, sceneW, sceneH, elevRange, polyCoords);

  // Build soil polygon overlays
  if (soilData && soilData.soil_map_units) {
    soilOverlayGroup = createSoilOverlays(soilData.soil_map_units, bbox, sceneW, sceneH);
    scene.add(soilOverlayGroup);
  }

  // Position camera
  const center = new THREE.Vector3(0, sceneH * 0.15 * exaggeration, 0);
  controls.target.copy(center);
  const dist = Math.max(sceneW, sceneH) * 1.2;
  camera.position.set(dist * 0.6, dist * 0.8, dist * 0.6);
  camera.lookAt(center);
  controls.update();

  // Store dimensions for later use
  terrainMesh.userData = { sceneW, sceneH, elevMin, elevMax, elevRange, bbox, insideMask, cellWidthFt, cellHeightFt };

  // Update stats
  updateStats();
  updateLegend();
  drawHistogram();
}

function buildBoundaryLine(bbox, sceneW, sceneH, elevRange, polyCoords) {
  if (!polyCoords || polyCoords.length < 3) return;

  const points = [];
  const lngRange = bbox.max_lng - bbox.min_lng || 1;
  const latRange = bbox.max_lat - bbox.min_lat || 1;

  for (const coord of polyCoords) {
    const lng = coord[0] !== undefined ? coord[0] : coord.lng || coord.longitude;
    const lat = coord[1] !== undefined ? coord[1] : coord.lat || coord.latitude;
    const x = ((lng - bbox.min_lng) / lngRange - 0.5) * sceneW;
    const y = ((lat - bbox.min_lat) / latRange - 0.5) * sceneH;

    // Sample elevation at this point
    const gridCol = Math.round(((lng - bbox.min_lng) / lngRange) * (cols - 1));
    const gridRow = Math.round(((lat - bbox.min_lat) / latRange) * (rows - 1));
    let z = 0;
    if (gridRow >= 0 && gridRow < rows && gridCol >= 0 && gridCol < cols) {
      const elev = elevationGrid[gridRow][gridCol];
      if (elev != null) {
        const elevNorm = (elev - minElev) / elevRange;
        z = elevNorm * (sceneH * 0.3) * exaggeration + 0.02; // Slightly above surface
      }
    }
    points.push(new THREE.Vector3(x, z, -y)); // Note: after rotation, Y is up, so we use -y for depth
  }
  // Close the loop
  if (points.length > 0) points.push(points[0].clone());

  const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
  const lineMat = new THREE.LineBasicMaterial({ color: 0xE91E8C, linewidth: 2 });
  boundaryLine = new THREE.Line(lineGeo, lineMat);
  scene.add(boundaryLine);
}

// ---- Vertex coloring ----
function applyVertexColors(geometry, layer) {
  const positions = geometry.attributes.position;
  const count = positions.count;
  let colorAttr = geometry.attributes.color;
  if (!colorAttr) {
    colorAttr = new THREE.BufferAttribute(new Float32Array(count * 3), 3);
    geometry.setAttribute('color', colorAttr);
  }
  const ud = terrainMesh ? terrainMesh.userData : {};
  const elevRange = ud.elevRange || (maxElev - minElev) || 1;

  for (let i = 0; i < count; i++) {
    const planeRow = Math.floor(i / cols);
    const planeCol = i % cols;
    const gridRow = rows - 1 - planeRow;
    const inside = ud.insideMask ? ud.insideMask[gridRow * cols + planeCol] : true;
    const elev = elevationGrid[gridRow] ? elevationGrid[gridRow][planeCol] : null;

    if (!inside) {
      // Make outside vertices transparent (dark, blends with background)
      colorAttr.setXYZ(i, 0.1, 0.1, 0.1);
      continue;
    }
    if (elev == null) {
      colorAttr.setXYZ(i, 0.2, 0.2, 0.2);
      continue;
    }

    let color;
    const t = (elev - minElev) / elevRange;

    switch (layer) {
      case 'elevation':
        color = elevationColor(t);
        break;
      case 'nccpi':
        const nVal = nccpiVertexValues[gridRow] ? nccpiVertexValues[gridRow][planeCol] : null;
        color = nccpiColor(nVal);
        break;
      case 'slope':
        const s = slopeGrid[gridRow] ? slopeGrid[gridRow][planeCol] : 0;
        color = slopeColor(s);
        break;
      case 'satellite':
        color = new THREE.Color(0.5, 0.5, 0.5); // fallback gray if texture not loaded
        break;
      default:
        color = elevationColor(t);
    }
    colorAttr.setXYZ(i, color.r, color.g, color.b);
  }
  colorAttr.needsUpdate = true;
}

function setSoilOverlayVisibility(layerType) {
  // layerType: 'nccpi', 'soiltype', or null to hide all
  if (!soilOverlayGroup) return;
  soilOverlayGroup.children.forEach(mesh => {
    if (!layerType) {
      mesh.visible = false;
    } else {
      mesh.visible = (mesh.userData.layerType === layerType);
    }
  });
}

function switchLayer(layer) {
  currentLayer = layer;
  if (!terrainMesh) return;

  // Hide soil overlays by default; show them for nccpi/soiltypes
  if (layer === 'nccpi') {
    // Use polygon overlays for NCCPI instead of vertex colors
    terrainMesh.material.map = null;
    terrainMesh.material.vertexColors = true;
    terrainMesh.material.needsUpdate = true;
    applyVertexColors(terrainMesh.geometry, 'elevation'); // base layer underneath
    setSoilOverlayVisibility('nccpi');
  } else if (layer === 'soiltypes') {
    terrainMesh.material.map = null;
    terrainMesh.material.vertexColors = true;
    terrainMesh.material.needsUpdate = true;
    applyVertexColors(terrainMesh.geometry, 'elevation'); // base layer underneath
    setSoilOverlayVisibility('soiltype');
  } else if (layer === 'satellite') {
    setSoilOverlayVisibility(null);
    loadSatelliteTexture();
  } else {
    // elevation, slope
    setSoilOverlayVisibility(null);
    terrainMesh.material.map = null;
    terrainMesh.material.vertexColors = true;
    terrainMesh.material.needsUpdate = true;
    applyVertexColors(terrainMesh.geometry, layer);
  }
  updateLegend();
}

function loadSatelliteTexture() {
  if (satelliteLoaded && satelliteTexture) {
    terrainMesh.material.map = satelliteTexture;
    terrainMesh.material.vertexColors = false;
    terrainMesh.material.needsUpdate = true;
    return;
  }

  const bbox = demData.bbox;
  const bboxStr = `${bbox.min_lng},${bbox.min_lat},${bbox.max_lng},${bbox.max_lat}`;
  const url = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export?bbox=${bboxStr}&bboxSR=4326&size=512,512&format=png&f=image`;

  const loader = new THREE.TextureLoader();
  loader.load(url, (tex) => {
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    satelliteTexture = tex;
    satelliteLoaded = true;
    if (currentLayer === 'satellite') {
      terrainMesh.material.map = tex;
      terrainMesh.material.vertexColors = false;
      terrainMesh.material.needsUpdate = true;
    }
  }, undefined, () => {
    console.warn('Failed to load satellite imagery');
  });
}

// ---- Exaggeration update ----
function updateExaggeration(newExag) {
  exaggeration = newExag;
  if (!terrainMesh) return;

  const ud = terrainMesh.userData;
  const positions = terrainMesh.geometry.attributes.position;

  for (let i = 0; i < positions.count; i++) {
    const planeRow = Math.floor(i / cols);
    const planeCol = i % cols;
    const gridRow = rows - 1 - planeRow;
    const inside = ud.insideMask[gridRow * cols + planeCol];
    const elev = elevationGrid[gridRow][planeCol];

    if (elev != null) {
      const elevNorm = (elev - ud.elevMin) / ud.elevRange;
      const zVal = elevNorm * (ud.sceneH * 0.3) * exaggeration;
      positions.setZ(i, zVal);
    } else {
      positions.setZ(i, 0.5 * (ud.sceneH * 0.3) * exaggeration);
    }
  }
  positions.needsUpdate = true;
  terrainMesh.geometry.computeVertexNormals();

  // Update boundary line
  if (boundaryLine) {
    scene.remove(boundaryLine);
    boundaryLine.geometry.dispose();
    const polyCoords = tractData ? tractData.polygon_coordinates : null;
    buildBoundaryLine(ud.bbox, ud.sceneW, ud.sceneH, ud.elevRange, polyCoords);
  }

  // Update soil overlays
  updateSoilOverlayExaggeration();
}

// ---- Stats ----
function updateStats() {
  document.getElementById('stat-min').textContent = minElev.toFixed(1) + ' ft';
  document.getElementById('stat-max').textContent = maxElev.toFixed(1) + ' ft';
  document.getElementById('stat-mean').textContent = meanElev.toFixed(1) + ' ft';
  document.getElementById('stat-relief').textContent = (maxElev - minElev).toFixed(1) + ' ft';
}

// ---- Legend ----
function updateLegend() {
  const canvas = document.getElementById('legend-gradient');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  const titleEl = document.getElementById('legend-title');
  const minLabel = document.getElementById('legend-min');
  const maxLabel = document.getElementById('legend-max');

  switch (currentLayer) {
    case 'elevation':
      titleEl.textContent = 'Elevation';
      for (let x = 0; x < w; x++) {
        const c = elevationColor(x / w);
        ctx.fillStyle = `rgb(${c.r*255|0},${c.g*255|0},${c.b*255|0})`;
        ctx.fillRect(x, 0, 1, h);
      }
      minLabel.textContent = minElev.toFixed(0) + ' ft';
      maxLabel.textContent = maxElev.toFixed(0) + ' ft';
      break;
    case 'nccpi':
      titleEl.textContent = 'NCCPI';
      const nccpiStops = [[1,0,0],[1,0.647,0],[1,1,0],[0.565,0.933,0.565],[0,0.392,0]];
      for (let x = 0; x < w; x++) {
        const t = x / w;
        const idx = t * (nccpiStops.length - 1);
        const i = Math.floor(idx);
        const f = idx - i;
        const c0 = nccpiStops[Math.min(i, nccpiStops.length-1)];
        const c1 = nccpiStops[Math.min(i+1, nccpiStops.length-1)];
        const r = c0[0] + f * (c1[0] - c0[0]);
        const g = c0[1] + f * (c1[1] - c0[1]);
        const b = c0[2] + f * (c1[2] - c0[2]);
        ctx.fillStyle = `rgb(${r*255|0},${g*255|0},${b*255|0})`;
        ctx.fillRect(x, 0, 1, h);
      }
      minLabel.textContent = '0';
      maxLabel.textContent = '100';
      break;
    case 'slope':
      titleEl.textContent = 'Slope';
      const slopeStops = [[0.2,0.8,0.2],[1,1,0],[1,0.6,0],[1,0,0]];
      for (let x = 0; x < w; x++) {
        const t = x / w;
        const idx = t * (slopeStops.length - 1);
        const i = Math.floor(idx);
        const f = idx - i;
        const c0 = slopeStops[Math.min(i, slopeStops.length-1)];
        const c1 = slopeStops[Math.min(i+1, slopeStops.length-1)];
        const r = c0[0] + f * (c1[0] - c0[0]);
        const g = c0[1] + f * (c1[1] - c0[1]);
        const b = c0[2] + f * (c1[2] - c0[2]);
        ctx.fillStyle = `rgb(${r*255|0},${g*255|0},${b*255|0})`;
        ctx.fillRect(x, 0, 1, h);
      }
      minLabel.textContent = '0%';
      maxLabel.textContent = '10%+';
      break;
    case 'satellite':
      titleEl.textContent = 'Satellite';
      ctx.fillStyle = '#444';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#888';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ArcGIS World Imagery', w/2, h/2 + 3);
      minLabel.textContent = '';
      maxLabel.textContent = '';
      break;
    case 'soiltypes': {
      titleEl.textContent = 'Soil Types';
      // Draw colored swatches for each soil type
      const units = (soilData && soilData.soil_map_units) ? soilData.soil_map_units.filter(u => u.polygons) : [];
      if (units.length > 0) {
        const swatchW = w / units.length;
        units.forEach((u, i) => {
          ctx.fillStyle = SOIL_TYPE_COLORS[i % SOIL_TYPE_COLORS.length];
          ctx.fillRect(i * swatchW, 0, swatchW, h);
        });
        minLabel.textContent = units[0].musym || '';
        maxLabel.textContent = units[units.length - 1].musym || '';
      } else {
        ctx.fillStyle = '#444';
        ctx.fillRect(0, 0, w, h);
        minLabel.textContent = '';
        maxLabel.textContent = '';
      }
      break;
    }
  }
}

function drawHistogram() {
  const canvas = document.getElementById('histogram-canvas');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  if (minElev >= maxElev) return;

  const bins = 30;
  const counts = new Array(bins).fill(0);
  const range = maxElev - minElev;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const v = elevationGrid[r][c];
      if (v == null) continue;
      const bi = Math.min(Math.floor(((v - minElev) / range) * bins), bins - 1);
      counts[bi]++;
    }
  }

  const maxCount = Math.max(...counts);
  if (maxCount === 0) return;

  const barW = w / bins;
  for (let i = 0; i < bins; i++) {
    const barH = (counts[i] / maxCount) * h;
    const t = i / bins;
    const color = elevationColor(t);
    ctx.fillStyle = `rgb(${color.r*255|0},${color.g*255|0},${color.b*255|0})`;
    ctx.fillRect(i * barW, h - barH, barW - 0.5, barH);
  }
}

// ---- Raycaster / Tooltip ----
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let tooltipVisible = false;

function onPointerMove(event) {
  if (!terrainMesh) return;

  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(terrainMesh);
  const tooltip = document.getElementById('tooltip');

  if (intersects.length > 0) {
    const pt = intersects[0].point;
    const faceIdx = intersects[0].faceIndex;
    const geo = terrainMesh.geometry;
    const idx = geo.index ? geo.index.getX(faceIdx * 3) : faceIdx * 3;
    const planeRow = Math.floor(idx / cols);
    const planeCol = idx % cols;
    const gridRow = rows - 1 - planeRow;

    if (gridRow >= 0 && gridRow < rows && planeCol >= 0 && planeCol < cols) {
      const elev = elevationGrid[gridRow][planeCol];
      const ud = terrainMesh.userData;
      const inside = ud.insideMask[gridRow * cols + planeCol];

      if (elev != null && inside) {
        document.getElementById('tooltip-elev').textContent = elev.toFixed(1) + ' ft';

        const layerLabel = document.getElementById('tooltip-layer-label');
        const layerValue = document.getElementById('tooltip-layer-value');

        switch (currentLayer) {
          case 'nccpi': {
            // Try to find which soil polygon this point is in
            const lng = ud.bbox.min_lng + (planeCol / (cols - 1)) * (ud.bbox.max_lng - ud.bbox.min_lng);
            const lat = ud.bbox.min_lat + (gridRow / (rows - 1)) * (ud.bbox.max_lat - ud.bbox.min_lat);
            let nVal = null;
            let soilName = '';
            if (soilData && soilData.soil_map_units) {
              for (const unit of soilData.soil_map_units) {
                if (unit.polygons && unit.nccpi != null) {
                  for (const ring of unit.polygons) {
                    if (pointInPolygon(lng, lat, ring)) {
                      nVal = unit.nccpi;
                      soilName = unit.name || unit.musym || '';
                      break;
                    }
                  }
                  if (nVal != null) break;
                }
              }
            }
            if (nVal == null) {
              nVal = nccpiVertexValues[gridRow] ? nccpiVertexValues[gridRow][planeCol] : null;
            }
            layerLabel.textContent = 'NCCPI' + (soilName ? ' - ' + soilName : '');
            layerValue.textContent = nVal != null ? nVal.toFixed(1) : 'N/A';
            break;
          }
          case 'soiltypes': {
            const lng2 = ud.bbox.min_lng + (planeCol / (cols - 1)) * (ud.bbox.max_lng - ud.bbox.min_lng);
            const lat2 = ud.bbox.min_lat + (gridRow / (rows - 1)) * (ud.bbox.max_lat - ud.bbox.min_lat);
            let typeName = '';
            let typeNccpi = null;
            if (soilData && soilData.soil_map_units) {
              for (const unit of soilData.soil_map_units) {
                if (unit.polygons) {
                  for (const ring of unit.polygons) {
                    if (pointInPolygon(lng2, lat2, ring)) {
                      typeName = unit.name || unit.musym || '';
                      typeNccpi = unit.nccpi;
                      break;
                    }
                  }
                  if (typeName) break;
                }
              }
            }
            layerLabel.textContent = 'Soil Type';
            layerValue.textContent = typeName || 'N/A';
            break;
          }
          case 'slope': {
            const s = slopeGrid[gridRow] ? slopeGrid[gridRow][planeCol] : 0;
            layerLabel.textContent = 'Slope';
            layerValue.textContent = s.toFixed(1) + '%';
            break;
          }
          case 'elevation':
            layerLabel.textContent = '';
            layerValue.textContent = '';
            break;
          case 'satellite':
            layerLabel.textContent = '';
            layerValue.textContent = '';
            break;
        }

        tooltip.style.display = 'block';
        tooltip.style.left = (event.clientX + 14) + 'px';
        tooltip.style.top = (event.clientY - 14) + 'px';

        // Keep tooltip within viewport
        const tr = tooltip.getBoundingClientRect();
        if (tr.right > window.innerWidth) {
          tooltip.style.left = (event.clientX - tr.width - 14) + 'px';
        }
        if (tr.bottom > window.innerHeight) {
          tooltip.style.top = (event.clientY - tr.height - 14) + 'px';
        }

        tooltipVisible = true;
        return;
      }
    }
  }

  if (tooltipVisible) {
    tooltip.style.display = 'none';
    tooltipVisible = false;
  }
}

// ---- Animation loop ----
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// ---- Event bindings ----
document.querySelectorAll('input[name="layer"]').forEach(radio => {
  radio.addEventListener('change', (e) => {
    switchLayer(e.target.value);
  });
});

document.getElementById('exag-slider').addEventListener('input', (e) => {
  const v = parseFloat(e.target.value);
  document.getElementById('exag-value').textContent = v.toFixed(1) + 'x';
  updateExaggeration(v);
});

// ---- Main ----
async function main() {
  if (!tractId) return;

  try {
    initScene();

    // Fetch data in parallel
    setLoadingText('Fetching tract data...');
    setProgress(10);

    const [tractResp, demResp, soilResp] = await Promise.allSettled([
      apiFetch(`/api/tracts/${tractId}`),
      apiFetch(`/api/tracts/${tractId}/dem`),
      apiFetch(`/api/tracts/${tractId}/soil-data`),
    ]);

    setProgress(60);
    setLoadingText('Building terrain mesh...');

    // Process tract data
    if (tractResp.status === 'fulfilled') {
      tractData = tractResp.value;
      const name = tractData.name || tractData.tract_number || 'Tract';
      document.getElementById('tract-name').textContent = name;
      const acreage = tractData.acres || tractData.total_acres;
      const sub = [];
      if (acreage) sub.push(parseFloat(acreage).toFixed(1) + ' acres');
      if (tractData.county) sub.push(tractData.county);
      if (tractData.state) sub.push(tractData.state);
      document.getElementById('tract-sub').textContent = sub.join(' | ');
    }

    // Process DEM data
    if (demResp.status === 'fulfilled' && demResp.value.grid) {
      demData = demResp.value;
    } else {
      const err = demResp.status === 'rejected' ? demResp.reason.message : (demResp.value?.error || 'No elevation data available');
      showError(err);
      return;
    }

    // Process soil data
    if (soilResp.status === 'fulfilled') {
      soilData = soilResp.value;
    }

    setProgress(80);

    // Build the 3D terrain
    buildTerrain();

    setProgress(100);

    // Start render loop
    animate();

    // Attach pointer events after build
    renderer.domElement.addEventListener('pointermove', onPointerMove);
    renderer.domElement.addEventListener('pointerleave', () => {
      document.getElementById('tooltip').style.display = 'none';
      tooltipVisible = false;
    });

    // Start loading satellite in background
    if (currentLayer !== 'satellite') {
      setTimeout(() => loadSatelliteTexture(), 1000);
    }

    hideLoading();

  } catch (err) {
    console.error('3D Viewer error:', err);
    showError(err.message || 'Failed to load terrain data');
  }
}

main();
</script>
